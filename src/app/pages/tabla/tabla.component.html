<table class="table__contenido">
    <thead>
        <tr>
            <th *ngFor="let columna of columnas">{{columna}}</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of getDataForCurrentPage()">
            <td *ngFor="let columna of columnas">{{ item[columna] }}</td>
        </tr>
    </tbody>
</table>

<div class="table__paginacion">
    <button class="table__anterior" (click)="prevPage()" [disabled]="currentPage == 1">Anterior</button>
    <span class="table__page">Página {{currentPage}} de {{totalPages}}</span>
    <button class="tabla__siguiente" (click)="nextPage()" [disabled]="currentPage === totalPages">Siguiente</button>
</div>
