
@if (ui.cargando) { 
    <app-state state="loading"
        message="Cargando egreso">

    </app-state>

} @else if (ui.error && !egresoSeleccionado) {

    <app-state state="error"
        [message]="ui.error">

    </app-state>

} @else if (egresoSeleccionado) {

    <app-formulario-egreso [egresoForm]="egresoForm"
        [actualizar]="true"
        [cargando]="ui.guardando"

        (submitForm)="actualizarEgreso()"
        (cancelar)="cerrarCaja()">
    
    </app-formulario-egreso>

}
