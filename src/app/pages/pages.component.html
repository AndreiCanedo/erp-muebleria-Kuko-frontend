

<div class="layout">

    @if (menuAbierto) {
        <button type="button"
            class="layout__backdrop"
            aria-label="Cerrar menu"
            (click)="cerrarMenu()">
        </button>
    }
        
    <!-- Menu Lateral -->
    <aside class="layout__aside"
        [class.layout__aside--open]="menuAbierto">

        <app-sidebar (navegar)="cerrarMenu()">

        </app-sidebar>

    </aside>

    <div class="layout__content">
            
        <!-- Menu Horizontal -->
        <header class="layout__nav">
            <app-header [menuAbierto]="menuAbierto"
                (menuClick)="toggleMenu()">

            </app-header>
        </header>

        <!-- Hoja principal -->
        <main class="layout__dashboard">
            <router-outlet></router-outlet>
        </main>
    </div>

</div>
