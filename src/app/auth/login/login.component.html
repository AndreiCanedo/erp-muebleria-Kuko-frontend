<div class="layout-login__layout">
    <div class="layout-login">
        <div class="layout__menu">
            <div class="menu__title">
                <h5 class="title__text">MUEBLERIAS KUKO</h5>
                <h3 class="title__subtitile">muebles de calidad a tu medida</h3>
            </div>
            <div class="menu__login">
                <form class="login__form"
                        autocomplete="off"
                        [formGroup]="loginForm"
                        (ngSubmit)="login()"
                        id="loginForm">
                    <label for="username" class="login__title">Username</label>
                    <input type="text" class="login__box" id="username" formControlName="username">
        
                    <label for="password" class="login__title">Password</label>
                    <input type="password" class="login__box" id="password" formControlName="password">
                    
                    <div class="login__check">
                        <input type="checkbox" class="check__box" id="remember" formControlName="remember">
                        <label for="remember" class="check__title">Remember this Divices</label> 
                
                        <a href="#" class="login__forget">Forgot Password?</a>
                    </div>
                
                    <div class="login__buttom">
                        <button class="buttom__loguear" type="submit">
                            Sign in
                        </button>
                    </div>
                </form>
                
                
                               
            </div>
        
            <div class="menu__option">
                <h3 class="option__text">or sign in with</h3>
        
                <div class="option__login">
        
                    <button class="login__google">
                        <i class="fa-solid fa-google google__icon"></i>
                        <span class="google__text">Sign in with Google</span>
                    </button>
        
                </div>
            </div>
        
            <footer class="menu__footer">
                <span class="footer__text">No cuentas con una cuenta? <a routerLink="/register" class="footer__link">Registrate aqui</a></span>
            </footer>
            
        </div>
    </div>
</div>
