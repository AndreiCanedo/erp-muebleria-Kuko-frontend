
<div class="state" 
[class.state--loading]="state === 'loading'" 
[class.state--error]="state === 'error'" >

    <i class="state__icon" [ngClass]="iconClass"></i>

    <p class="state__message">
        {{ message }}
    </p>
    
    @if(state === 'error'){
    
        <button type="button"
            class="state__button"
            (click)="onRetry()">
            
            {{ buttonText }}
        </button>
    
    }

</div>
